; PlatformIO Project Configuration File
;
; Las librerías Kame y Octosnake y el gamepad.h vienen del submódulo con el repositorio original
; de JavierIH (../hardware/kame32-JavierIH). Si la carpeta está vacía: git submodule update --init
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    rpolitex/ArduinoNvs
lib_extra_dirs = ${PROJECT_DIR}/../hardware/kame32-JavierIH/code/lib
build_flags = -I${PROJECT_DIR}/../hardware/kame32-JavierIH/code/include

; Calibration tool, with a page to set each servo position (modified from the original).
[env:calibration]
build_src_filter = +<calibration.cpp>

; Original oscillator gait + web joystick (unmodified upstream code, see src/gamepad.cpp).
[env:gamepad]
build_src_filter = +<gamepad.cpp>

; RL policy control: keeps the web UI + joystick, replaces the oscillator gait with the
; trained neural-network policy. Requires lib/Policy/policy_weights.h (generated by
; the export script of the training project). This is the sketch to flash for the trained walk.
[env:policy]
build_src_filter = +<policy_gamepad.cpp>
